<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemental Weapon Ball Arena</title>
    <!-- Tailwind core utilities via CDN (pas de build PostCSS nécessaire) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Correctif audio (limiteur + volume maître) : à charger AVANT le bundle du jeu -->
    <script src="/boa-audio-fix.js"></script>
    <!-- Polices : Press Start 2P (titres pixel) + Inter (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #F5F0E8; font-family: 'Inter', system-ui, sans-serif; }
      .font-pixel { font-family: 'Press Start 2P', monospace; }
      /* Animations de l'écran de statistiques */
      @keyframes statFadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes recordPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .stat-card { animation: statFadeUp .45s ease both; }
      .new-record { animation: recordPulse 1.1s ease-in-out infinite; }
      .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
    <script type="module" crossorigin src="/assets/index-DlY4Q-ti.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Couche publication (capture exports + programmation YouTube/TikTok) -->
    <script src="/boa-autopublish.js"></script>
  </body>
</html>
